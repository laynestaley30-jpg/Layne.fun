<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layne.fun</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat+Brush&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#111; --sub:#222;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141414;--ink:#f5f5f5;--sub:#ddd}
}
:root[data-theme="dark"]{--bg:#141414;--ink:#f5f5f5;--sub:#ddd}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Patrick Hand",system-ui,sans-serif}
header{text-align:center;padding:40px 16px 24px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:"Caveat Brush","Patrick Hand",cursive;font-size:clamp(56px,16vw,96px);line-height:1;letter-spacing:1px;margin:0;text-transform:uppercase}
.face{width:.62em;height:.62em;border-radius:50%;background:#ffd23f;border:3px solid var(--ink);
  display:inline-flex;align-items:center;justify-content:center;font-size:.5em}
header p{margin:10px 0 0;font-size:clamp(20px,5vw,28px);font-family:system-ui,sans-serif;font-weight:300}
main{max-width:640px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:16px}
.card{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;
  border-radius:22px;border:4px solid var(--ink);text-decoration:none;color:inherit;overflow:hidden;
  padding:20px;transition:transform .15s ease}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:4px solid #3b82f6;outline-offset:3px}
.card h2{margin:0;font-family:"Caveat Brush",cursive;font-size:clamp(40px,11vw,64px);line-height:1;font-weight:400}
.card small{display:block;margin-top:6px;font-size:18px;opacity:.8}
.c1{background:#ffe3ec;border-color:#c2185b;color:#7a0f3a}
.c2{background:#fbf3e6;border-color:#d9cdb8;color:#222}
.c3{background:#fff;border-color:#f6c945;color:#b3202e}
.c4{background:#b8e2e0;border-color:#4a3425;color:#4a3425}
.c5{background:#fff;border-color:var(--ink)}
.soon{border-style:dashed;background:transparent;border-color:#999;color:#888}
footer{text-align:center;padding:0 16px 40px;font-size:18px;opacity:.6}
.card{position:relative;min-height:170px}
.card>div{position:relative;z-index:1}
.deco{position:absolute;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.2))}
.logo::before{content:"✨";font-size:.4em;align-self:flex-start}
.logo::after{content:"⭐";font-size:.4em;align-self:flex-end}
.c1{background:repeating-linear-gradient(180deg,#bfe9ff 0 28px,#a5dcf7 28px 32px);border-color:#0b5d8c;color:#fff}
.c1 h2{-webkit-text-stroke:2px #0b5d8c;text-shadow:4px 4px 0 #0b5d8c;transform:rotate(-3deg)}
.c2{background:repeating-linear-gradient(90deg,#9d1b2e 0 36px,#7f1424 36px 44px);border-color:#e2b53c;color:#ffd978}
.c2 h2{-webkit-text-stroke:2px #4a0a14;text-shadow:3px 3px 0 #4a0a14;letter-spacing:2px}
.c3{background:radial-gradient(circle at 20% 20%,#1c3a5e,#0a1424);border-color:#22d3ee;color:#7df3ff}
.c3 h2{text-shadow:0 0 12px #22d3ee,3px 3px 0 #064e5b}
.c4{background:linear-gradient(180deg,#9be28a,#4aa83a);border-color:#2c5f1d;color:#ffe14d}
.c4 h2{-webkit-text-stroke:2px #5b3a12;text-shadow:4px 4px 0 #5b3a12;transform:rotate(2deg)}
.c5{background:repeating-linear-gradient(45deg,#f3e8ff 0 14px,#e6d3ff 14px 28px);border:4px dashed #7e22ce;color:#6b21a8}
.c6{background:linear-gradient(180deg,#ffd9a8,#ff9f43);border-color:#b34700;color:#fff}
.c6 h2{-webkit-text-stroke:2px #b34700;text-shadow:4px 4px 0 #b34700;transform:rotate(-2deg)}
.c7{background:radial-gradient(circle at 30% 20%,#2b3a67,#0b1020);border-color:#7fb2ff;color:#cfe3ff}
.c7 h2{text-shadow:0 0 12px #7fb2ff,3px 3px 0 #1a2a55}
.c5 h2{-webkit-text-stroke:1px #6b21a8;text-shadow:3px 3px 0 #d8b4fe}
#warp{position:fixed;inset:0;z-index:200;background:#fff;color:#111;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(10vh + env(safe-area-inset-top,0px)) 24px calc(12vh + env(safe-area-inset-bottom,0px));text-align:center;clip-path:circle(0 at var(--x,50%) var(--y,50%))}
#warp.on{display:flex;animation:wipe .75s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes wipe{to{clip-path:circle(160% at var(--x,50%) var(--y,50%))}}
#warp>*{opacity:0;animation:fadein .4s .7s forwards}
@keyframes fadein{to{opacity:1}}
#warp-title{margin:0;font-family:"Caveat Brush",cursive;font-weight:400;font-size:clamp(44px,13vw,80px);line-height:1;-webkit-text-stroke:2px #111;color:#fff;text-shadow:4px 4px 0 #111}
.star-wrap{perspective:600px}
.star-wrap svg{width:min(46vw,200px);height:auto;animation:spin 1.6s linear infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes spin{to{transform:rotateY(360deg)}}
#warp-lives{font-family:"Caveat Brush",cursive;font-size:clamp(36px,10vw,56px)}
.diving header,.diving main,.diving footer{transition:transform .75s ease-in,filter .75s ease-in;transform:scale(1.5);transform-origin:50% 35%;filter:blur(4px)}
@media (prefers-reduced-motion: reduce){.star-wrap svg{animation-duration:4s}}
.star-wrap{position:relative;width:min(50vw,220px);aspect-ratio:1;filter:drop-shadow(0 0 16px rgba(255,200,40,.85))}
.star3d{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 2.2s linear infinite}
.star-wrap svg{position:absolute;inset:0;width:100%;height:100%;animation:none;filter:none}
.spark{position:absolute;color:#ffd23f;text-shadow:0 0 6px #fff,0 0 2px #b87400;animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
#warp-lives{display:flex;align-items:center;gap:10px;font-size:clamp(44px,12vw,68px);line-height:1}
#warp-lives .life-icon{width:1.25em;height:1.25em;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#warp-lives .x,#warp-lives .n{color:#fff;-webkit-text-stroke:2px #111;text-shadow:3px 3px 0 #111}
#warp{background:transparent;clip-path:none}
#warp.on{animation:none}
#warp>#warp-grid{position:absolute;inset:0;z-index:-1;display:grid;opacity:1;animation:none}
#warp-grid i{background:#fff;box-shadow:0 0 0 1px #fff;opacity:0;animation:pop .001s forwards}
@keyframes pop{to{opacity:1}}
#warp-title{font-family:"Press Start 2P",monospace;font-size:clamp(18px,5.6vw,32px);line-height:1.6;color:#111;-webkit-text-stroke:0;text-shadow:4px 4px 0 #ffd23f;max-width:100%;overflow-wrap:anywhere}
.star-wrap{filter:none}
.star3d{display:none}
.star-px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;animation:pixspin 1.6s steps(12) infinite}
@keyframes pixspin{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.spark{width:10px;height:10px;background:#ffd23f;box-shadow:0 0 0 3px #111;text-shadow:none;font-size:0 !important;animation:twinkle 1.2s steps(2) infinite}
#warp-lives{font-family:"Press Start 2P",monospace;font-size:clamp(24px,7vw,40px)}
#warp-lives svg{display:none}
#warp-lives .life-px{width:1.6em;height:1.6em;image-rendering:pixelated}
#warp-lives .x,#warp-lives .n{color:#111;-webkit-text-stroke:0;text-shadow:3px 3px 0 #ffd23f}
.star-3dpx{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 2.4s steps(20) infinite}
.star-3dpx canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate.hidden{display:none}
#gate h2{margin:0;font-family:"Caveat Brush",cursive;font-size:clamp(40px,12vw,64px);font-weight:400}
#gate p{margin:0;font-size:22px}
#gate input{width:min(320px,100%);font:inherit;font-size:24px;text-align:center;padding:12px 16px;border:4px solid var(--ink);border-radius:16px;background:var(--bg);color:var(--ink);text-transform:uppercase}
#gate input:focus-visible{outline:4px solid #3b82f6;outline-offset:3px}
#gate button{font:inherit;font-size:24px;padding:10px 32px;border:4px solid var(--ink);border-radius:16px;background:#ffd23f;color:#111;cursor:pointer}
#gate .err{min-height:1.4em;color:#d32f2f;font-size:20px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#gate input.bad{animation:shake .3s;border-color:#d32f2f}

/* ===== UPGRADE ===== */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;color:var(--ink);background:radial-gradient(60% 40% at 12% 8%,rgba(255,210,63,.4),transparent 70%),radial-gradient(50% 40% at 92% 28%,rgba(255,61,129,.25),transparent 70%),radial-gradient(70% 50% at 50% 105%,rgba(59,130,246,.35),transparent 70%)}
#bg::before{content:"";position:absolute;inset:-60px;background:radial-gradient(currentColor 1.5px,transparent 2px) 0 0/28px 28px;opacity:.12;animation:drift 20s linear infinite}
@keyframes drift{to{transform:translate(28px,28px)}}
#bg b{position:absolute;bottom:-30px;width:var(--s);height:var(--s);background:var(--c);border:2px solid #111;opacity:.75;animation:up var(--t) linear var(--d) infinite}
@keyframes up{from{transform:translateY(0) rotate(45deg)}to{transform:translateY(-115vh) rotate(405deg)}}
header{padding-top:48px}
.logo{font-size:clamp(64px,19vw,116px);background:linear-gradient(90deg,#ff3d81,#ffd23f,#22d3ee,#a855f7,#ff3d81) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 0 0 #1a1033) drop-shadow(-3px 0 0 #1a1033) drop-shadow(0 3px 0 #1a1033) drop-shadow(0 -3px 0 #1a1033) drop-shadow(0 9px 0 rgba(0,0,0,.28));animation:hue 6s linear infinite}
.ready .logo{animation:hue 6s linear infinite,pop .9s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes hue{to{background-position:300% 0}}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.face{animation:wob 2.4s ease-in-out infinite;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd23f 60%,#f29a00)}
@keyframes wob{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-8px)}}
.logo::before,.logo::after{animation:twk 1.8s ease-in-out infinite}
@keyframes twk{50%{transform:scale(1.5) rotate(20deg)}}
header p{display:inline-block;padding:6px 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:400;transform:rotate(-1.5deg);box-shadow:4px 4px 0 #ffd23f}
main{gap:22px;max-width:680px}
body:not(.ready) .card{opacity:0}
.ready .card{animation:rise .7s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85) rotate(-3deg)}}
.c1{--sh:#07405f;--tx:#fff;--ol:#0b5d8c}.c2{--sh:#a07a1c;--tx:#ffd978;--ol:#4a0a14}.c3{--sh:#064e5b;--tx:#aef6ff;--ol:#031a24}
.c4{--sh:#1f4a14;--tx:#ffe14d;--ol:#5b3a12}.c5{--sh:#4c1d95;--tx:#fff;--ol:#6b21a8}.c6{--sh:#7a2f00;--tx:#fff;--ol:#b34700}.c7{--sh:#0a1a4a;--tx:#e6f0ff;--ol:#1a2a55}
.card{min-height:190px;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .2s ease-out,box-shadow .2s;
  box-shadow:inset 0 5px 0 rgba(255,255,255,.35),inset 0 -8px 0 rgba(0,0,0,.15),0 8px 0 var(--sh,#0004),0 22px 36px -8px rgba(0,0,0,.4)}
.card:hover{--ty:-6px}
.card:active{--ty:5px;transform:perspective(800px) translateY(5px);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 2px 0 var(--sh,#0004)}
.card::before{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);transform:translateX(-70%);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.card h2{color:var(--tx);-webkit-text-stroke:9px var(--ol);paint-order:stroke fill;text-shadow:0 5px 0 var(--ol);letter-spacing:1px;font-size:clamp(44px,12vw,72px);transform:rotate(-2deg);transition:transform .2s}
.c3 h2{text-shadow:0 5px 0 var(--ol),0 0 24px #22d3ee}.c7 h2{text-shadow:0 5px 0 var(--ol),0 0 24px #7fb2ff}
.card:hover h2{transform:rotate(0) scale(1.07)}
.card small{display:inline-block;margin-top:14px;padding:8px 18px 6px;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;border:3px solid rgba(255,255,255,.9);font-family:"Press Start 2P",monospace;font-size:12px;letter-spacing:1px;opacity:1;text-transform:uppercase;transition:transform .2s,background .2s}
.card small::before{content:"\25B6  "}
.card:hover small{background:var(--ol);transform:scale(1.12)}
.c5 small{animation:pls 1.4s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.1)}}
.deco{font-size:inherit;transform:translate(-50%,-50%) rotate(var(--r,0deg));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-65%) rotate(calc(var(--r,0deg) + 10deg))}}
footer{opacity:.8}
#gate{background:radial-gradient(circle at 50% 0,#5b21b6,#1e1b4b 70%);color:#fff}
#gate h2{background:linear-gradient(#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000)}
#gate h2::before{content:"\1F512";display:block;animation:wob 2s ease-in-out infinite}
#gate input{background:#fff;color:#111;border-color:#ffd23f;box-shadow:0 6px 0 #b8860b}
#gate button{box-shadow:0 6px 0 #b8860b;transition:transform .1s}
#gate button:active{transform:translateY(5px);box-shadow:0 1px 0 #b8860b}
/* warp */
#warp-grid i{opacity:0;outline:1px solid #fff;animation:tile .45s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes tile{from{transform:scale(0) rotate(-90deg);opacity:1;box-shadow:inset 0 0 0 99px var(--ac)}to{transform:none;opacity:1;box-shadow:inset 0 0 0 0 var(--ac)}}
.diving header,.diving main,.diving footer{transition:transform .9s ease-in,filter .9s ease-in;transform:scale(1.9) rotate(2deg);filter:blur(6px) brightness(1.3)}
#warp-title{text-shadow:4px 4px 0 var(--ac,#ffd23f)}
#warp-title .w{display:inline-block;white-space:nowrap}
#warp-title .w span{display:inline-block;opacity:0;animation:drop .5s calc(.7s + var(--k)*50ms) cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-60px) scale(1.6) rotate(-20deg)}to{opacity:1;transform:none}}
.star-wrap::before{content:"";position:absolute;inset:-70%;z-index:-1;background:repeating-conic-gradient(var(--ac,#ffd23f) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);opacity:.55;animation:rot 8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#warp>.ring{position:absolute;transform:translate(-50%,-50%);border:8px solid var(--ac);border-radius:50%;opacity:1;animation:ringx .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ringx{from{width:0;height:0;opacity:1}to{width:260vmax;height:260vmax;opacity:0}}
#warp>.burst{position:absolute;width:var(--s);height:var(--s);border:3px solid #111;opacity:1;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(360deg) scale(.2);opacity:0}}
#warp-bar{position:absolute;left:14%;right:14%;bottom:calc(5vh + env(safe-area-inset-bottom,0px));height:22px;border:4px solid #111;background:#fff;box-shadow:4px 4px 0 var(--ac)}
#warp-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--ac) 0 10px,#111 10px 12px);animation:fill 2.1s .8s steps(18) forwards}
@keyframes fill{to{width:100%}}
#flash{position:fixed;inset:0;z-index:300;opacity:0;pointer-events:none}
#flash.on{animation:fl .35s forwards}
@keyframes fl{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#bg b,#bg::before,.deco,.card::before,.face,.logo,.logo::before,.logo::after,.c5 small{animation:none}}
</style>
</head>
<body>
<div id="gate" role="dialog" aria-labelledby="gate-title">
  <h2 id="gate-title">Enter the passcode</h2>

  <div class="err" id="err" aria-live="polite"></div>
  <button id="go" type="button">Enter</button>
</div>
<header>
  <h1 class="logo">Layne<span class="face" aria-hidden="true">🙂</span>Fun</h1>

</header>

<main id="games"></main>
<footer>More games coming soon</footer>

</div>

<script>

const DECO = {

  "Theater Experience": [["🎭",6,14,-12,42],["🍿",84,14,12,40],["⭐",16,70,0,28],["🎬",82,66,-10,38],["⭐",50,82,0,22]],

/* Pixel art star and life icon */
(function(){
  const n = 28;
  const c = document.createElement("canvas");
  c.width = c.height = n; c.className = "star-px";
  const ctx = c.getContext("2d");
  const P = [[50,5],[62,35],[95,37],[70,58],[79,92],[50,73],[21,92],[30,58],[5,37],[38,35]].map(p => [p[0]*n/100, p[1]*n/100]);
  function inside(px, py){
    let ins = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const xi = P[i][0], yi = P[i][1], xj = P[j][0], yj = P[j][1];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
    }
    return ins;
  }
  const m = [];
  for (let y = 0; y < n; y++) { m[y] = []; for (let x = 0; x < n; x++) m[y][x] = inside(x + .5, y + .5); }
  const at = (x, y) => !!(m[y] && m[y][x]);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (!m[y][x]) continue;
    const edge = !(at(x-1,y) && at(x+1,y) && at(x,y-1) && at(x,y+1));
    const t = (x + y) / (2 * n);
    ctx.fillStyle = edge ? "#4a2f00" : t < .38 ? "#fff3a0" : t < .62 ? "#ffd23f" : "#f29a00";
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.fillStyle = "#1a1100";
  [11, 15].forEach(x => ctx.fillRect(x, 13, 2, 3));
  ctx.fillStyle = "#fff";
  [11, 15].forEach(x => ctx.fillRect(x, 13, 1, 1));
  const side = document.createElement("canvas");
  side.width = side.height = n;
  const sx = side.getContext("2d");
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (!m[y][x]) continue;
    const edge = !(at(x-1,y) && at(x+1,y) && at(x,y-1) && at(x,y+1));
    sx.fillStyle = edge ? "#4a2f00" : "#d99200";
    sx.fillRect(x, y, 1, 1);
  }
  const spinner = document.createElement("div");
  spinner.className = "star-3dpx";
  for (let i = -4; i <= 4; i++) {
    const L = document.createElement("canvas");
    L.width = L.height = n;
    L.getContext("2d").drawImage(Math.abs(i) === 4 ? c : side, 0, 0);
    L.style.transform = "translateZ(" + (i * 3) + "px)";
    spinner.append(L);
  }
  document.querySelector(".star-wrap").append(spinner);

  const rows = [
    "...kkkkkk...",
    "..krrrrrrk..",
    ".krrrwwrrrk.",
    ".krrrwwrrrk.",
    "kRRRRRRRRRRk",
    "kssssssssssk",
    "kssskssksssk",
    "kssskssksssk",
    "kp" + "s".repeat(8) + "pk",
    "kss" + "k" + "ssss" + "k" + "ss" + "k",
    ".kss" + "kkkk" + "ssk.",
    "..kkkkkkkk.."
  ];
  const pal = { k: "#111", r: "#e53935", R: "#b71c1c", s: "#ffc233", p: "#ff8a80", w: "#fff" };
  const lc = document.createElement("canvas");
  lc.width = 12; lc.height = 12; lc.className = "life-px";
  const lx = lc.getContext("2d");
  rows.forEach((row, y) => row.split("").forEach((ch, x) => {
    if (pal[ch]) { lx.fillStyle = pal[ch]; lx.fillRect(x, y, 1, 1); }
  }));
  document.getElementById("warp-lives").prepend(lc);
})();

/* Painting jump animation */
let going = false;
const ACC = {c1:"#29b6f6",c2:"#ffd978",c3:"#22d3ee",c4:"#ffe14d",c5:"#a855f7",c6:"#ff9f43",c7:"#7fb2ff"};
function blip(){ try { const a = new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime;
  [[988,0],[1319,.09]].forEach(([f,d]) => { const o = a.createOscillator(), v = a.createGain(); o.type = "square"; o.frequency.value = f;
    v.gain.setValueAtTime(.08, t+d); v.gain.exponentialRampToValueAtTime(.001, t+d+.35); o.connect(v).connect(a.destination); o.start(t+d); o.stop(t+d+.4); }); } catch(e) {} }
function enterGame(g, e){
  if (going) return; going = true; blip();
  const w = document.getElementById("warp"), ac = ACC[g.cls] || "#ffd23f", t = document.getElementById("warp-title");
  t.innerHTML = ""; let k = 0;
  g.title.split(" ").forEach((wd, i) => { if (i) t.append(" "); const ww = document.createElement("span"); ww.className = "w";
    [...wd].forEach(ch => { const s = document.createElement("span"); s.textContent = ch; s.style.setProperty("--k", k++); ww.append(s); }); t.append(ww); });
  const ox = e.clientX || innerWidth / 2, oy = e.clientY || innerHeight / 2;
  w.style.setProperty("--ac", ac); w.style.setProperty("--x", ox + "px"); w.style.setProperty("--y", oy + "px");
  w.querySelectorAll(".burst,.ring,#warp-bar").forEach(n => n.remove());
  let grid = document.getElementById("warp-grid");
  if (!grid) { grid = document.createElement("div"); grid.id = "warp-grid"; w.prepend(grid); }
  const cols = 8, cell = innerWidth / cols, rows = Math.ceil(innerHeight / cell);
  const maxD = Math.hypot(Math.max(ox, innerWidth - ox), Math.max(oy, innerHeight - oy));
  grid.style.gridTemplateColumns = "repeat(" + cols + ",1fr)"; grid.style.gridTemplateRows = "repeat(" + rows + ",1fr)"; grid.innerHTML = "";
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const d = Math.hypot((c + .5) * cell - ox, (r + .5) * (innerHeight / rows) - oy) / maxD, i = document.createElement("i");
    i.style.animationDelay = (d * .5 + Math.random() * .15).toFixed(2) + "s"; grid.append(i);
  }
  const ring = document.createElement("div"); ring.className = "ring"; ring.style.cssText = `left:${ox}px;top:${oy}px`; w.append(ring);
  for (let i = 0; i < 26; i++) { const b = document.createElement("i"), a = Math.random() * 6.283, d = 120 + Math.random() * Math.max(innerWidth, innerHeight) * .6;
    b.className = "burst"; b.style.cssText = `left:${ox}px;top:${oy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--s:${8+Math.random()*12}px;background:${i%2?ac:"#ffd23f"};animation-delay:${(Math.random()*.15).toFixed(2)}s`; w.append(b); }
  const bar = document.createElement("div"); bar.id = "warp-bar"; bar.innerHTML = "<i></i>"; w.append(bar);
  document.body.classList.add("diving"); w.classList.add("on");
  let f = document.getElementById("flash"); if (!f) { f = document.createElement("div"); f.id = "flash"; document.body.append(f); }
  f.style.background = ac;
  setTimeout(() => f.classList.add("on"), 2850);
  setTimeout(() => { location.href = g.url; }, 3250);
}
window.addEventListener("pageshow", () => {
  going = false;
  document.body.classList.remove("diving");
  document.getElementById("warp").classList.remove("on");
  const f = document.getElementById("flash"); if (f) f.classList.remove("on");
});

/* Passcode gate */
const PASSCODE = "HENRYISGOATED";
const gate = document.getElementById("gate");
const input = document.getElementById("code");
const err = document.getElementById("err");
function unlock(){ gate.classList.add("hidden"); document.body.classList.add("ready"); }
try { if (localStorage.getItem("layne-unlocked") === "yes") unlock(); } catch(e) {}
function tryCode(){
  if (input.value.trim().toUpperCase() === PASSCODE) {
    try { localStorage.setItem("layne-unlocked", "yes"); } catch(e) {}
    unlock();
  } else {
    err.textContent = "Wrong code, try again.";
    input.classList.remove("bad"); void input.offsetWidth; input.classList.add("bad");
    input.select();
  }
}
document.getElementById("go").addEventListener("click", tryCode);
input.addEventListener("keydown", e => { if (e.key === "Enter") tryCode(); });

/* Background sparkles + card tilt */
(function(){
  const bg = document.createElement("div"); bg.id = "bg"; document.body.prepend(bg);
  const C = ["#ffd23f","#ff3d81","#22d3ee","#a855f7","#7ee081"];
  for (let i = 0; i < 16; i++) { const b = document.createElement("b");
    b.style.cssText = `left:${Math.random()*100}%;--s:${8+Math.random()*10}px;--c:${C[i%5]};--t:${12+Math.random()*14}s;--d:${(-Math.random()*20).toFixed(1)}s`; bg.append(b); }
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return;
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.style.setProperty("--ry", ((x - .5) * 12).toFixed(1) + "deg"); c.style.setProperty("--rx", ((.5 - y) * 12).toFixed(1) + "deg");
      c.style.setProperty("--mx", x * 100 + "%"); c.style.setProperty("--my", y * 100 + "%"); });
    c.addEventListener("pointerleave", () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
  });
})();
